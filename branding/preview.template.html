<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מימיתחזה – לוגו</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #f5f2fb; font-family: system-ui, sans-serif; color: #13111c; }
  h2 { font-size: 16px; margin: 28px 0 12px; }
  .wordmark { width: 100%; max-width: 900px; display: block; }
  .row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .row figure { margin: 0; text-align: center; font-size: 12px; color: #6b6480; }
  .phone { background: #1e1a2b; padding: 20px; border-radius: 20px; display: inline-flex; gap: 18px; }
  .phone img { width: 60px; height: 60px; }
  .phone.light { background: #dcd8e6; }
</style>
</head>
<body>
  <h2>לוגו מלא</h2>
  <object class="wordmark" data="mimi-wordmark.svg" type="image/svg+xml"></object>

  <h2>אייקון בגדלים שונים</h2>
  <div class="row">
    <figure><img src="mimi-icon.svg" width="256" alt=""><figcaption>256px</figcaption></figure>
    <figure><img src="mimi-icon.svg" width="128" alt=""><figcaption>128px</figcaption></figure>
    <figure><img src="mimi-icon.svg" width="64" alt=""><figcaption>64px</figcaption></figure>
    <figure><img src="mimi-icon.svg" width="32" alt=""><figcaption>32px</figcaption></figure>
  </div>

  <h2>על מסך בית של טלפון</h2>
  <div class="phone"><img src="mimi-icon.svg" alt=""><img src="mimi-icon.svg" alt=""></div>
  <div class="phone light"><img src="mimi-icon.svg" alt=""><img src="mimi-icon.svg" alt=""></div>
</body>
</html>
