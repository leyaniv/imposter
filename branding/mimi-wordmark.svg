<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <title>מימיתחזה</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@500;900&amp;display=swap');
    .name { font-family: 'Heebo', Arial, sans-serif; font-weight: 900; font-size: 132px; }
    .tag { font-family: 'Heebo', Arial, sans-serif; font-weight: 500; font-size: 46px; fill: #a49cbc; }
  </style>
  <rect width="1200" height="420" rx="56" fill="#13111c"/>
  <svg x="800" y="50" width="320" height="320" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2540"/>
      <stop offset="1" stop-color="#13111c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a91f"/>
      <stop offset="1" stop-color="#f8dc4e"/>
    </linearGradient>
    <clipPath id="head">
      <path d="M256 146 C356 146 438 202 440 294 C442 384 358 432 256 432 C154 432 70 384 72 294 C74 202 156 146 256 146 Z"/>
    </clipPath>
    <!-- העיניים מוזזות לצדדים ב-transform, וה-clipPath זז איתן -->
    <clipPath id="eyeL">
      <path d="M134 262 Q178 226 230 266 Q190 304 134 262 Z"/>
    </clipPath>
    <clipPath id="eyeR">
      <path d="M378 262 Q334 226 282 266 Q322 304 378 262 Z"/>
    </clipPath>
  </defs>

  <!-- רקע -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="230" fill="url(#glow)"/>

  <!-- אוזניים -->
  <path d="M100 254 L62 110 Q58 92 76 98 L212 166 Z" fill="#141217"/>
  <path d="M412 254 L450 110 Q454 92 436 98 L300 166 Z" fill="#141217"/>
  <path d="M114 214 L84 128 L178 174 Z" fill="#b9787c"/>
  <path d="M398 214 L428 128 L334 174 Z" fill="#b9787c"/>

  <!-- ראש: בסיס לבן, ושני אזורים שחורים משני צדי הפס הלבן -->
  <g clip-path="url(#head)">
    <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
    <!-- צד ימין של מימי (שמאל בציור): השחור חוצה את העין באלכסון ויורד על הלחי -->
    <path d="M40 100 L238 100 L238 192 C232 214 222 234 210 248 C190 266 162 284 136 300 C116 312 96 328 72 344 L40 350 Z" fill="#141217"/>
    <!-- צד שמאל של מימי (ימין בציור): השחור מכסה את כל העין ויורד עד ליד האף -->
    <path d="M250 100 L472 100 L472 300 C440 314 410 320 382 318 C370 316 364 298 351 298 C338 298 332 314 300 320 C288 319 280 316 276 310 C272 290 268 262 264 236 C258 190 252 150 248 100 Z" fill="#141217"/>
    <!-- מעל קו הריסים הכול שחור, כך שהפס הלבן נעצר שם בקצה חד -->
    <path d="M230 100 L300 100 L300 236 L264 236 Q250 214 238 192 L230 180 Z" fill="#141217"/>
  </g>

  <!-- עיניים: מבט חשדני עם עפעף עליון נמוך -->
  <g transform="translate(-18 0)">
    <path d="M134 262 Q178 226 230 266 Q190 304 134 262 Z" fill="url(#iris)"/>
    <g clip-path="url(#eyeL)">
      <ellipse cx="190" cy="268" rx="7" ry="24" fill="#141217"/>
      <path d="M120 220 L240 220 L240 258 Q182 238 120 262 Z" fill="#141217"/>
    </g>
    <path d="M134 262 Q178 226 230 266 Q190 304 134 262 Z" fill="none" stroke="#141217" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="199" cy="264" r="4" fill="#ffffff"/>
    </g>

  <g transform="translate(18 0)">
    <path d="M378 262 Q334 226 282 266 Q322 304 378 262 Z" fill="url(#iris)"/>
    <g clip-path="url(#eyeR)">
      <ellipse cx="322" cy="268" rx="7" ry="24" fill="#141217"/>
      <path d="M392 220 L272 220 L272 258 Q330 238 392 262 Z" fill="#141217"/>
    </g>
    <path d="M378 262 Q334 226 282 266 Q322 304 378 262 Z" fill="none" stroke="#141217" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="331" cy="264" r="4" fill="#ffffff"/>
    </g>

  <!-- הכתם השחור מתחת לאף, הסימן המזהה של מימי: אליפטי מעט, גדול מהאף, בצד ימין שלה -->
  <path d="M244 356 C244 371 232 380 216 380 C198 380 188 370 189 356 C190 342 202 333 218 333 C235 333 244 342 244 356 Z" fill="#141217"/>

  <!-- אף -->
  <path d="M236 326 Q256 316 276 326 Q273 341 256 352 Q239 341 236 326 Z" fill="#e8939a"/>

  <!-- חיוך ערמומי מתחת לכתם, וקו שמחבר אותו לאף -->
  <path d="M256 352 L256 391 M230 389 Q243 401 256 391 Q269 401 282 389" fill="none" stroke="#5a4446" stroke-width="3.5" stroke-linecap="round"/>

  <!-- שפמים -->
  <g stroke="#f5f2fb" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M184 346 Q136 334 56 338"/>
    <path d="M184 356 Q136 356 62 374"/>
    <path d="M186 368 Q146 378 82 406"/>
    <path d="M308 346 Q372 332 456 338"/>
    <path d="M308 354 Q372 354 450 372"/>
    <path d="M304 362 Q362 374 430 404"/>
  </g>
</svg>
  <text x="750" y="214" direction="rtl" text-anchor="start" class="name"><tspan fill="#ff4d6d">מי</tspan><tspan fill="#ff9aae">מי</tspan><tspan fill="#f5f2fb">תחזה</tspan></text>
  <text x="750" y="296" direction="rtl" text-anchor="start" class="tag">משחק מתחזה בעברית</text>
</svg>
